name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Test files run in parallel by default. Several spawn child processes and
      # wait on 20-45s readiness timeouts, which intermittently fails on 2-core
      # windows runners (different test each run). Serializing costs ~8s locally
      # and removes that contention.
      - name: Test
        run: npm test -- --test-concurrency=1
      - run: npm run test:pack
