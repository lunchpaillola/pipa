name: CI

on: pull_request

jobs:
  test:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: >-
          node --test --test-concurrency=1
          test/state.test.mjs test/slack-actions.test.mjs
          test/routines.test.mjs test/opencode-v2.test.mjs
