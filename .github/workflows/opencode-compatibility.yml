name: OpenCode compatibility

on:
  workflow_dispatch:
    inputs:
      full_qualification:
        description: Collect the broad deterministic matrix and migration (not release certification)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  engines:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Windows native harness is outside the current release scope; unit/package CI remains.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/verification/self-check.mjs
      # Two pins x three modes: 24 journey observations per host, no provider secrets.
      - if: ${{ !inputs.full_qualification }}
        run: npm run test:beta -- --report=beta-smoke.json
      - if: ${{ inputs.full_qualification }}
        run: npm run test:engines -- --migration --gate=deterministic --report=opencode-compatibility.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-compatibility-${{ matrix.os }}
          path: |
            beta-smoke.json
            opencode-compatibility.json
