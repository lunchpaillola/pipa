name: OpenCode compatibility

on:
  workflow_dispatch:
    inputs:
      full_qualification:
        description: Collect the broad deterministic matrix and migration (not release certification)
        type: boolean
        default: false
  pull_request:
    paths:
      - "src/**"
      - "bin/**"
      - "package*.json"
      - "scripts/test-opencode-matrix.mjs"
      - "scripts/verification/**"
      - "test/helpers/**"
      - "test/opencode-contract.test.mjs"
      - "test/fixtures/opencode*/**"
      - ".github/workflows/opencode-compatibility.yml"

permissions:
  contents: read

jobs:
  engines:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/verification/self-check.mjs
      # Two pins x three modes: 24 journey observations per host, no provider secrets.
      - if: github.event_name != 'workflow_dispatch' || !inputs.full_qualification
        run: npm run test:beta -- --report=beta-smoke.json
      - if: github.event_name == 'workflow_dispatch' && inputs.full_qualification
        run: npm run test:engines -- --migration --gate=deterministic --report=opencode-compatibility.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-compatibility-${{ matrix.os }}
          path: |
            beta-smoke.json
            opencode-compatibility.json
