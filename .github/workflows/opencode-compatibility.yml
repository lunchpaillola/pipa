name: OpenCode compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "bin/**"
      - "package*.json"
      - "scripts/test-opencode-matrix.mjs"
      - "scripts/verification/**"
      - "test/helpers/**"
      - "test/opencode-contract.test.mjs"
      - "test/fixtures/opencode*/**"
      - ".github/workflows/opencode-compatibility.yml"

permissions:
  contents: read

jobs:
  engines:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/verification/self-check.mjs
      # Baseline labels collection only. Deterministic failures remain strict;
      # live/deployment evidence stays BLOCKED and releaseQualified stays false.
      # Local opt-in transition command: npm run test:engines -- --baseline --migration
      - run: npm run test:engines -- --baseline --migration --gate=deterministic --report=opencode-compatibility.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-compatibility-${{ matrix.os }}
          path: opencode-compatibility.json
