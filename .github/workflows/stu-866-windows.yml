name: STU-866 Windows smoke
on:
  push:
    branches: [verify/stu-866-windows-7250d2a]
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare process birth probes
        run: node .github/workflows/stu-866-probe.mjs
