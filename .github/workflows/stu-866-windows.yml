name: STU-866 Windows smoke
on:
  push:
    branches: [verify/stu-866-windows-7250d2a]
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test test/state.test.mjs test/restart.test.mjs
      - if: ${{ !cancelled() }}
        run: >-
          node --test --test-name-pattern='isolated Managed restart .*: ready' test/cli.test.mjs
